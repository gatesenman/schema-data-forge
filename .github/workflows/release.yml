name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SchemaDataForge-windows
          - os: macos-latest
            artifact: SchemaDataForge-macos
          - os: ubuntu-latest
            artifact: SchemaDataForge-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop]" pyinstaller
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SchemaDataForge
          --icon assets/icon.ico
          --collect-data schema_data_forge
          --collect-data xmlschema
          --collect-data jsonschema_specifications
          launcher.py
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name SchemaDataForge
          --icon assets/icon.icns
          --collect-data schema_data_forge
          --collect-data xmlschema
          --collect-data jsonschema_specifications
          launcher.py
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name SchemaDataForge
          --collect-data schema_data_forge
          --collect-data xmlschema
          --collect-data jsonschema_specifications
          launcher.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/SchemaDataForge.exe -DestinationPath ${{ matrix.artifact }}.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/SchemaDataForge.app ${{ matrix.artifact }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/SchemaDataForge
          zip -j ${{ matrix.artifact }}.zip dist/SchemaDataForge
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
